name: ARM-SecNet Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate documentation and evidence file presence
        run: bash scripts/validate-lab.sh
      - name: Check whitespace
        run: git diff --check
